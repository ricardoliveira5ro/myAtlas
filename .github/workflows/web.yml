name: Web CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint web app
        run: npm run lint -w @my-atlas/web

      - name: Check TypeScript types
        run: npm run typecheck -w @my-atlas/web

      - name: Build web app
        run: npm run build -w @my-atlas/web
