services:
  postgres:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?Set POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}
      ACCOUNT_DB_PASSWORD: ${ACCOUNT_DB_PASSWORD:?Set ACCOUNT_DB_PASSWORD}
      ATLAS_DB_PASSWORD: ${ATLAS_DB_PASSWORD:?Set ATLAS_DB_PASSWORD}
      MEDIA_DB_PASSWORD: ${MEDIA_DB_PASSWORD:?Set MEDIA_DB_PASSWORD}
      SOCIAL_DB_PASSWORD: ${SOCIAL_DB_PASSWORD:?Set SOCIAL_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - application
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  account:
    image: "${IMAGE_REGISTRY:?Set IMAGE_REGISTRY}/account:${IMAGE_TAG:?Set IMAGE_TAG}"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8081
      ACCOUNT_DB_URL: jdbc:postgresql://postgres:5432/account_db
      ACCOUNT_DB_USER: account
      ACCOUNT_DB_PASSWORD: ${ACCOUNT_DB_PASSWORD:?Set ACCOUNT_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - application
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/8081
          printf 'GET /actuator/health/readiness HTTP/1.0\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          grep -q '^HTTP/1\.[01] 200' <&3
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 90s
    restart: unless-stopped

  atlas:
    image: "${IMAGE_REGISTRY:?Set IMAGE_REGISTRY}/atlas:${IMAGE_TAG:?Set IMAGE_TAG}"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8082
      ATLAS_DB_URL: jdbc:postgresql://postgres:5432/atlas_db
      ATLAS_DB_USER: atlas
      ATLAS_DB_PASSWORD: ${ATLAS_DB_PASSWORD:?Set ATLAS_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - application
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/8082
          printf 'GET /actuator/health/readiness HTTP/1.0\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          grep -q '^HTTP/1\.[01] 200' <&3
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 90s
    restart: unless-stopped

  media:
    image: "${IMAGE_REGISTRY:?Set IMAGE_REGISTRY}/media:${IMAGE_TAG:?Set IMAGE_TAG}"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8083
      MEDIA_DB_URL: jdbc:postgresql://postgres:5432/media_db
      MEDIA_DB_USER: media
      MEDIA_DB_PASSWORD: ${MEDIA_DB_PASSWORD:?Set MEDIA_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - application
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/8083
          printf 'GET /actuator/health/readiness HTTP/1.0\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          grep -q '^HTTP/1\.[01] 200' <&3
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 90s
    restart: unless-stopped

  social:
    image: "${IMAGE_REGISTRY:?Set IMAGE_REGISTRY}/social:${IMAGE_TAG:?Set IMAGE_TAG}"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8084
      SOCIAL_DB_URL: jdbc:postgresql://postgres:5432/social_db
      SOCIAL_DB_USER: social
      SOCIAL_DB_PASSWORD: ${SOCIAL_DB_PASSWORD:?Set SOCIAL_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - application
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/8084
          printf 'GET /actuator/health/readiness HTTP/1.0\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          grep -q '^HTTP/1\.[01] 200' <&3
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 90s
    restart: unless-stopped

  web:
    image: "${IMAGE_REGISTRY:?Set IMAGE_REGISTRY}/web:${IMAGE_TAG:?Set IMAGE_TAG}"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      account:
        condition: service_healthy
      atlas:
        condition: service_healthy
      media:
        condition: service_healthy
      social:
        condition: service_healthy
    networks:
      - application
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 45s
    restart: unless-stopped

networks:
  application:

volumes:
  postgres-data:
