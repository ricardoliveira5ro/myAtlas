name: myatlas-instance1

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2.10.2-alpine@sha256:d8c17a862962def15cde69863a3a463f25a2664942eafd7bdbf050e9c3116b83
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
      WWW_DOMAIN: ${WWW_DOMAIN:?Set WWW_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
      INSTANCE2_PRIVATE_IP: ${INSTANCE2_PRIVATE_IP:?Set INSTANCE2_PRIVATE_IP}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
      account:
        condition: service_healthy
    networks:
      - application
    mem_limit: 64m
    logging: *default-logging
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  web:
    image: "${IMAGE_REGISTRY:?Set IMAGE_REGISTRY}/web:${IMAGE_TAG:?Set IMAGE_TAG}"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      account:
        condition: service_healthy
    networks:
      - application
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 45s
    mem_limit: 224m
    logging: *default-logging
    restart: unless-stopped

  account:
    image: "${IMAGE_REGISTRY:?Set IMAGE_REGISTRY}/account:${IMAGE_TAG:?Set IMAGE_TAG}"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8081
      ACCOUNT_DB_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:5432/account_db
      ACCOUNT_DB_USER: account
      ACCOUNT_DB_PASSWORD: ${ACCOUNT_DB_PASSWORD:?Set ACCOUNT_DB_PASSWORD}
      JAVA_TOOL_OPTIONS: -Xmx176m -XX:MaxMetaspaceSize=96m
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - application
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/8081
          printf 'GET /actuator/health/readiness HTTP/1.0\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          grep -q '^HTTP/1\.[01] 200' <&3
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 90s
    mem_limit: 352m
    logging: *default-logging
    restart: unless-stopped

  postgres:
    image: postgis/postgis:18-3.6@sha256:530bb81ad6c5993ae870ea66095d9dc758ef5866007186833f31fb2bebdd5791
    command: ["postgres", "-c", "max_connections=40", "-c", "shared_buffers=96MB"]
    shm_size: 96mb
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?Set POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}
      ACCOUNT_DB_PASSWORD: ${ACCOUNT_DB_PASSWORD:?Set ACCOUNT_DB_PASSWORD}
      ATLAS_DB_PASSWORD: ${ATLAS_DB_PASSWORD:?Set ATLAS_DB_PASSWORD}
      MEDIA_DB_PASSWORD: ${MEDIA_DB_PASSWORD:?Set MEDIA_DB_PASSWORD}
      SOCIAL_DB_PASSWORD: ${SOCIAL_DB_PASSWORD:?Set SOCIAL_DB_PASSWORD}
    ports:
      - "${INSTANCE1_PRIVATE_IP:?Set INSTANCE1_PRIVATE_IP}:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - application
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 352m
    logging: *default-logging
    restart: unless-stopped

networks:
  application:

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
