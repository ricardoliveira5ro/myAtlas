openapi: 3.1.0
info:
  title: MyAtlas Atlas API
  description: Atlas and identity service API
  version: v1
servers:
- url: /
  description: Relative API root
paths:
  /api/v1/atlas/ping:
    get:
      tags:
      - info-controller
      summary: Check Atlas service availability
      operationId: ping
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
      security: []
  /api/v1/atlas/info:
    get:
      tags:
      - info-controller
      summary: Get Atlas service information
      operationId: info
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
      security: []
components: {}
