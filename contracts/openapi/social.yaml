openapi: 3.1.0
info:
  title: MyAtlas Social API
  description: Social service API
  version: v1
servers:
- url: /
  description: Relative API root
paths:
  /api/v1/social/ping:
    get:
      tags:
      - info-controller
      summary: Check social service availability
      operationId: ping
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
      security: []
  /api/v1/social/info:
    get:
      tags:
      - info-controller
      summary: Get social service information
      operationId: info
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
      security: []
components: {}
