openapi: 3.1.0
info:
  title: MyAtlas Account API
  description: Account and identity service API
  version: v1
servers:
- url: /
  description: Relative API root
paths:
  /api/v1/identity/ping:
    get:
      tags:
      - info-controller
      summary: Check account service availability
      operationId: ping
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
      security: []
  /api/v1/identity/info:
    get:
      tags:
      - info-controller
      summary: Get account service information
      operationId: info
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
      security: []
components: {}
