openapi: 3.1.0
info:
  title: MyAtlas Media API
  description: Media service API
  version: v1
servers:
- url: /
  description: Relative API root
paths:
  /api/v1/media/ping:
    get:
      tags:
      - info-controller
      summary: Check media service availability
      operationId: ping
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
      security: []
  /api/v1/media/info:
    get:
      tags:
      - info-controller
      summary: Get media service information
      operationId: info
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
      security: []
components: {}
